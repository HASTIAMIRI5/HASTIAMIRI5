      <stop offset="0" stop-color="#0b3b42"/>
      <stop offset="1" stop-color="#071a22"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#001013" flood-opacity=".35"/>
