<svg xmlns="http://www.w3.org/2000/svg" width="980" height="180" viewBox="0 0 980 180" role="img" aria-labelledby="title desc">
  <title id="title">AI Systems · Defensive Security · Infrastructure</title>
  <desc id="desc">Animated neon banner for Hasti Amiri's GitHub profile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1016"/>
      <stop offset="0.55" stop-color="#0c1a1f"/>
      <stop offset="1" stop-color="#140d1d"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5d4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00f5d4" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#bd5cff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect x="1" y="1" width="978" height="178" rx="22"/></clipPath>
  </defs>
  <rect x="1" y="1" width="978" height="178" rx="22" fill="url(#bg)" stroke="#00f5d4" stroke-opacity=".55" stroke-width="2"/>
  <g clip-path="url(#clip)">
    <path d="M-260 0h210l400 180h-210z" fill="url(#beam)" opacity=".55">
      <animateTransform attributeName="transform" type="translate" from="-520 0" to="1500 0" dur="5s" repeatCount="indefinite"/>
    </path>
    <circle cx="68" cy="90" r="3" fill="#00f5d4" opacity=".8"/>
    <circle cx="912" cy="90" r="3" fill="#bd5cff" opacity=".9"/>
    <text x="490" y="76" text-anchor="middle" fill="#00f5d4" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="6">HASTI AMIRI</text>
    <text x="490" y="119" text-anchor="middle" fill="#ecffff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="2" filter="url(#glow)">AI SYSTEMS  //  DEFENSIVE SECURITY</text>
    <text x="490" y="148" text-anchor="middle" fill="#bdcbd3" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="5">INFRASTRUCTURE · RESPONSIBLE RESEARCH · USEFUL TOOLS</text>
    <path d="M70 162H910" stroke="#00f5d4" stroke-opacity=".22"/>
    <path d="M70 162H220" stroke="#00f5d4" stroke-width="2" opacity=".8">
      <animate attributeName="x1" values="70;760;70" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="220;910;220" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
